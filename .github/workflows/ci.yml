name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm test
        env:
          USE_MEMORY_DB: "true"
          JWT_SECRET: "ci_test_secret_for_automated_testing_123!"
      - run: pnpm run build

name: Cloud Keep-Alive & Health Check

on:
  schedule:
    # Runs every 3 days at 06:00 UTC (prevents Supabase 7-day auto-pause)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: read
  issues: write

jobs:
  keep-alive:
    name: Ping Supabase & Render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Ping Dependencies
        run: npm install pg dotenv

      - name: Execute Keep-Alive Ping
        id: ping
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_URL: "https://ledgerly-mbcd.onrender.com"
        run: node scripts/ping.mjs

      - name: Open GitHub Issue on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🚨 [CRITICAL] Supabase Keep-Alive Health Check Failed" \
            --body "The automated keep-alive job failed to connect to Supabase or Render.
            
            **Action Required:**
            - Check Supabase Dashboard immediately: https://supabase.com/dashboard/project/nlcbqueuubymrlsqmeoc
            - Verify if project was paused or if DATABASE_URL secret was changed.
            - Check Render deployment: https://dashboard.render.com" \
            --label "incident"
